apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      hostNetwork: true
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      containers:
      - name: flask-app
        image: ccr.ccs.tencentyun.com/devops-automation-jt/my-monitoring-app:git-2b703bc
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: ansible-volume
          mountPath: /app/ansible
          readOnly: true
        - name: ssh-volume
          mountPath: /home/flask-user/.ssh
          readOnly: true

      volumes:

      - name: ansible-volume
        hostPath:
          path: /home/admin/monitor_project/ansible
          type: Directory

      - name: ssh-volume
        hostPath:
          path: /home/admin/.ssh
          type: Directory